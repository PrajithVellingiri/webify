<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In & Register — Webify Inventory Intelligence</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts & Custom Styling -->
  <link rel="stylesheet" href="css/enhanced-styles.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 460px;
    }

    .auth-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 40px 36px;
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--primary-gradient);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-brand {
      display: inline-block;
      margin-bottom: 16px;
    }

    .auth-brand img {
      max-width: 180px;
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(59, 130, 246, 0.35));
    }

    .auth-subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin: 0;
    }

    /* Auth Switch Tabs */
    .auth-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 26px;
      border: 1px solid var(--border-color);
    }

    .auth-tab-btn {
      flex: 1;
      text-align: center;
      padding: 9px 12px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
    }

    .auth-tab-btn.active {
      background: var(--primary-accent);
      color: #fff;
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4);
    }

    .auth-panel {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .auth-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <div class="auth-header">
        <a href="index.html" class="brand-header-link justify-content-center mb-2">
          <div class="brand-icon-box">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
          </div>
          <div class="brand-text-wrap text-start">
            <span class="brand-title">WEBIFY <span class="brand-accent">IMS</span></span>
            <span class="brand-subtitle">Inventory Management System</span>
          </div>
        </a>
        <p class="auth-subtitle">Production Risk & Inventory Control Center</p>
      </div>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <div class="auth-tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</div>
        <div class="auth-tab-btn" id="tabSignup" onclick="switchTab('signup')">Register</div>
      </div>

      <!-- Login Form Panel -->
      <div class="auth-panel active" id="loginPanel">
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label" for="loginEmail">Email Address</label>
            <input id="loginEmail" class="form-control" type="email" placeholder="name@company.com" required autocomplete="email">
          </div>
          <div class="mb-4">
            <label class="form-label" for="loginPassword">Password</label>
            <input id="loginPassword" class="form-control" type="password" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">
            Sign In to Dashboard
          </button>
        </form>
      </div>

      <!-- Signup Form Panel -->
      <div class="auth-panel" id="signupPanel">
        <form id="signupForm">
          <div class="mb-3">
            <label class="form-label" for="signupName">Full Name</label>
            <input id="signupName" class="form-control" type="text" placeholder="John Doe" required autocomplete="name">
          </div>
          <div class="mb-3">
            <label class="form-label" for="signupEmail">Work Email</label>
            <input id="signupEmail" class="form-control" type="email" placeholder="john@company.com" required autocomplete="email">
          </div>
          <div class="mb-4">
            <label class="form-label" for="signupPassword">Password</label>
            <input id="signupPassword" class="form-control" type="password" placeholder="Minimum 6 characters" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-success w-100 py-2">
            Create Account
          </button>
        </form>
      </div>

      <div class="mt-4 pt-3 text-center" style="border-top: 1px solid var(--border-color);">
        <small class="text-secondary" style="font-size: 0.78rem;">
          Enterprise Grade • JWT Encrypted • Real-time Planning
        </small>
      </div>

    </div>
  </div>

  <script>
    function switchTab(tab) {
      const loginTab = document.getElementById("tabLogin");
      const signupTab = document.getElementById("tabSignup");
      const loginPanel = document.getElementById("loginPanel");
      const signupPanel = document.getElementById("signupPanel");

      if (tab === 'login') {
        loginTab.classList.add("active");
        signupTab.classList.remove("active");
        loginPanel.classList.add("active");
        signupPanel.classList.remove("active");
      } else {
        signupTab.classList.add("active");
        loginTab.classList.remove("active");
        signupPanel.classList.add("active");
        loginPanel.classList.remove("active");
      }
    }
  </script>
  <script src="js/main.js"></script>

</body>
</html>
